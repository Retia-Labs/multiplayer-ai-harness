# One persistent relay and browser origin. The desktop/runtime is never deployed here.
services:
  - type: web
    name: plexus-alpha
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    buildCommand: npm ci --omit=dev
    startCommand: node packages/hub/server.js
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    disk:
      name: plexus-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: NODE_ENV
        value: production
      - key: HUB_HOST
        value: 0.0.0.0
      - key: HUB_DB
        value: /var/data/plexus.sqlite
      - key: PLEXUS_AUTH_MODE
        value: github
      - key: PLEXUS_PUBLIC_ORIGIN
        value: https://app.tryplexus.dev
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: PLEXUS_ALPHA_GITHUB_IDS
        sync: false
