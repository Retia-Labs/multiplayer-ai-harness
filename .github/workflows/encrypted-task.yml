name: Encrypted task, enrolment and catch-up
on:
  pull_request:
    paths:
      - 'packages/**'
      - 'test/encrypted-task*.js'
      - 'test/teammate-enrollment*.js'
      - 'test/catchup*.js'
      - 'apps/web/**'
      - 'test/enrollment-authority.js'
      - 'test/recovery-trust.js'
      - 'test/task-control-receipts.js'
      - 'test/e2ee-import-forgery.js'
      - 'test/hub-key-exchange.js'
      - 'test/shared-steering.js'
      - 'test/approval-grants.js'
      - 'test/encrypted-*.js'
      - 'test/codex-confinement.js'
      - 'test/codex*.js'
      - 'test/fixtures/encrypted-task*'
      - 'package*.json'
      - '.github/workflows/encrypted-task.yml'
permissions:
  contents: read
jobs:
  codex-tool-inventory:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install the pinned CLI in a disposable location
        run: npm install --prefix "$RUNNER_TEMP/plexus-codex" --no-save --ignore-scripts --no-audit --no-fund @openai/codex@0.153.4
      # Loopback-only synthetic Responses server: no account or model service used.
      - name: Verify actual exposed tools and configuration preflight
        run: PLEXUS_CODEX_INVENTORY_BIN="$RUNNER_TEMP/plexus-codex/node_modules/.bin/codex" npm run test:codex:inventory
  encrypted-task:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - if: runner.os == 'Linux'
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - if: runner.os == 'Windows'
        run: node node_modules/playwright-core/cli.js install chromium
      - run: npm run test:encrypted-task
      - run: npm run test:teammate-enrollment
      - run: npm run test:import-forgery
      - run: npm run test:key-exchange
      - run: npm run test:catchup
      - run: npm run test:catchup:view
      - run: npm run test:catchup:encrypted
      - run: npm run test:help-inbox
      - run: npm run test:handover
      - run: npm run test:confined-writes
      - run: npm run test:related-work
      - run: npm run test:recovery
      - run: npm run test:recover-after-loss
      - run: npm run test:revocation
      - run: npm run test:protocol
      - run: npm run test:unit
      - run: npm run test:team
      - run: npm run test:steering
      - run: npm run test:approvals
      - run: npm run test:encrypted-real-task
      # Skips loudly without an authenticated CLI, which CI does not have.
      - run: npm run test:encrypted-codex-task
      - run: npm run test:codex-confinement
      - run: npm run test:codex
      - run: npm run test:enrollment-authority
      - run: npm run test:encrypted-controls
      - run: npm run test:runtime-lifecycle
      - run: npm run test:recovery-trust
      - run: npm run test:client-storage
      - run: npm run test:encrypted-workspace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-task-${{ matrix.os }}
          path: |
            .artifacts/encrypted-task/*.json
            .artifacts/teammate-enrollment/*.json
            .artifacts/catchup/*.json
            .artifacts/encrypted-workspace/*.json
            .artifacts/encrypted-workspace/*.png
            .artifacts/encrypted-workspace/README.md
          if-no-files-found: warn
