name: Encrypted endpoint experiment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/e2ee/**'
      - 'test/e2ee-*.js'
      - 'scripts/e2ee-platform-proof.js'
      - 'package*.json'
      - '.github/workflows/e2ee-experiment.yml'
permissions:
  contents: read
jobs:
  packaged-endpoints:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node node_modules/playwright-core/cli.js install chromium
      - run: npm run test:e2ee:acceptance
      - run: npm run test:e2ee:platform
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-endpoint-evidence-${{ matrix.os }}
          path: .artifacts/e2ee-complete/*.json
          if-no-files-found: warn
          retention-days: 14
