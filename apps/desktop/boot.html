<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Starting</title>
  <style>
    /* The brand face, loaded from the same bundled files the web UI uses. */
    @font-face { font-family: Outfit; font-weight: 100 900; font-display: swap;
      src: url(../web/fonts/Outfit-Latin-Variable.woff2) format('woff2-variations'); }
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #080a09; color: #eef1e9;
      font-family: Outfit, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13.5px;
    }
    .card { width: min(600px, 100%); padding: 28px; max-height: 100vh; overflow: auto; }
    #diagnostic-report { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; padding: 16px 0; }
    .actions { flex-wrap: wrap; }
    h1 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 4px; }
    .sub { color: #969d94; margin-bottom: 22px; }
    .step { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid rgba(225,239,217,.12); }
    .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; flex: none; background: rgba(225,239,217,.22); }
    .step.working .dot { background: #d2a75c; animation: pulse 1.2s infinite; }
    .step.ready   .dot { background: #79b36b; }
    .step.failed  .dot { background: #e0736a; }
    @keyframes pulse { 50% { opacity: .3; } }
    .label { font-weight: 500; }
    .detail { color: #969d94; font-size: 12.5px; margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
    .step.failed .detail { color: #e0736a; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
    .actions { display: flex; gap: 8px; margin-top: 20px; }
    button {
      font: inherit; color: #eef1e9; background: #161a16; border: 1px solid rgba(225,239,217,.22);
      border-radius: 6px; padding: 7px 14px; cursor: pointer;
    }
    button:hover { background: #1d221c; }
    button.primary { background: #d5f5a3; color: #080a09; border-color: transparent; font-weight: 600; }
    .hidden { display: none; }
    @media (prefers-reduced-motion: reduce) { .step.working .dot { animation: none; } }
  </style>
</head>
<body>
  <div class="card">
    <h1>Starting Plexus</h1>
    <div class="sub">Bringing up the team service and this machine.</div>

    <div class="step" id="step-hub"><span class="dot"></span><div><div class="label">Team service</div><div class="detail" id="detail-hub">Waiting…</div></div></div>
    <div class="step" id="step-runtime"><span class="dot"></span><div><div class="label">Execution host</div><div class="detail" id="detail-runtime">Waiting…</div></div></div>
    <div class="step" id="step-ui"><span class="dot"></span><div><div class="label">Workspace</div><div class="detail" id="detail-ui">Waiting…</div></div></div>

    <div class="actions hidden" id="actions">
      <button class="primary" id="retry">Try again</button>
      <button id="open-data">Open data folder</button>
      <button id="inspect-diagnostics">Inspect diagnostic report</button>
    </div>
    <section id="diagnostic-preview" class="hidden" aria-label="Diagnostic preview">
      <p class="detail">Review these fields before sharing the downloaded report yourself. No logs, task content, paths or credentials are included. Nothing is sent automatically.</p>
      <pre id="diagnostic-report"></pre>
      <button id="download-diagnostics">Download reviewed report</button>
    </section>
  </div>

  <script>
    const api = window.harnessDesktop || {};
    if (api.onBootStatus) {
      api.onBootStatus(({ step, state, detail }) => {
        const el = document.getElementById('step-' + step);
        const d = document.getElementById('detail-' + step);
        if (!el) return;
        el.className = 'step ' + state;
        if (d && detail) d.textContent = detail;
        // Anything that fails leaves the window up with the reason and a way forward,
        // rather than quitting silently the way the old shell did.
        if (state === 'failed') document.getElementById('actions').classList.remove('hidden');
      });
    }
    document.getElementById('retry').addEventListener('click', () => api.retryBoot && api.retryBoot());
    document.getElementById('open-data').addEventListener('click', () => api.openDataFolder && api.openDataFolder());
    let reviewedReport;
    document.getElementById('inspect-diagnostics').addEventListener('click', async () => {
      reviewedReport = JSON.stringify(await api.diagnostics(), null, 2);
      document.getElementById('diagnostic-report').textContent = reviewedReport;
      document.getElementById('diagnostic-preview').classList.remove('hidden');
    });
    document.getElementById('download-diagnostics').addEventListener('click', () => {
      if (!reviewedReport) return;
      const url = URL.createObjectURL(new Blob([reviewedReport], { type: 'application/json' }));
      const link = document.createElement('a'); link.href = url; link.download = 'plexus-diagnostics.json'; link.click(); URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
